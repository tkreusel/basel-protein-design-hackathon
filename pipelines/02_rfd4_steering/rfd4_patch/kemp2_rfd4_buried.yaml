# As plain + burial conditioning: all motif atoms and the whole ligand BURIED (rASA < 0.02); base / ligand carbons flagged as hydrophobic contacts;
# nitro O and base O marked H-bond acceptor sites, Ser OG donor.
kemp2_buried:
  input: kemp2_theozyme.cif
  contig: "A1, A2, EX1:148-258, /0, B1"
  conditions:
    C_CRD:
      true:
        - select: "sel('A/*/1/[CG,CD,OE1,OE2]')"
        - select: "sel('A/*/2/[CA,CB,OG]')"
        - select: "sel('B')"
    C_SEQ:
      true:
        - select: "sel('A/*/[1,2]')"
        - select: "sel('B')"
    C_IDX:
      false:
        - {select: "sel('A/*/1')", group: base}
        - {select: "sel('A/*/2')", group: ser}
    C_RAS:
      BURIED:
        - select: "sel('A/*/1/[CG,CD,OE1,OE2]')"
        - select: "sel('A/*/2/[CB,OG]')"
        - select: "sel('B')"
    C_HPHOB:
      true:
        - select: "sel('A/*/1/[CG,CD]')"
        - select: "sel('B/*/*/[C5,C6,C7,C4]')"
