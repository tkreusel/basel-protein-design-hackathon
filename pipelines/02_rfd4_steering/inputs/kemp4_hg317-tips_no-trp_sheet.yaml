# kemp4_no_trp_sheet: tips-only motif, burial + hydrophobic-contact + nitro-O H-bond-acceptor conditioning (nitro H-bond is CONDITIONED, not rewarded)
kemp4_no_trp_sheet:
  input: kemp_motif.cif
  contig: "A50, A127, EX1:118-258, /0, B1"
  conditions:
    C_CRD:
      true:
        - select: "sel('A/*/50/[CG,CD,OE1,NE2]')"
        - select: "sel('A/*/127/[CB,CG,OD1,OD2]')"
        - select: "sel('B')"
    C_SEQ:
      true:
        - select: "sel('A/*/[50,127]')"
        - select: "sel('B')"
    C_IDX:
      false:
        - {select: "sel('A/*/50')", group: gln}
        - {select: "sel('A/*/127')", group: asp}
    C_RAS:
      BURIED:
        - select: "sel('A/*/50/[CG,CD,OE1,NE2]')"
        - select: "sel('A/*/127/[CB,CG,OD1,OD2]')"
        - select: "sel('B')"
    C_HPHOB:
      true:
        - select: "sel('A/*/127/[CB,CG]')"
        - select: "sel('B/*/*/[C5,C6,C7,C4]')"
    C_HB:
      ACCEPTOR:
        - select: "sel('B/*/*/[O21,O11]')"
    C_SEC:                               # diversity variant: request beta-sheet over the whole expandable scaffold segment
      SHEET:
        - select: "sel('*/EX1')"
