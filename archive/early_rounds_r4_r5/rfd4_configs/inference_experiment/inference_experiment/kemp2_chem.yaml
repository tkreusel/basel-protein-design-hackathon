    "60": {metrics: [kemp_pocket, tmol_lig_ddg, kemp_chem], rewards: {tmol_lig_ddg.interface_ddg: {weight: -1.0, normalize_by: 20.0, clip: {min: -80.0, max: 20.0}}, kemp_pocket.volume_ratio_error: {weight: -0.5, clip: {max: 1.0}}, kemp_chem.base_sasa_rel: {weight: -1.0, clip: {max: 1.0}}, kemp_chem.base_apolar_frac: {weight: 1.0}, kemp_chem.nitro_hbonds: {weight: 0.5, clip: {max: 2.0}, normalize_by: 2.0}, kemp_chem.base_hbond_partners: {weight: -0.25, clip: {max: 3.0}, normalize_by: 3.0}}}
