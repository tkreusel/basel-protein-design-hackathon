# @package _global_
# Kemp theozyme GDM_KE_1483, burial-conditioned (kemp2_rfd4_buried.yaml). Steered arm "chem": beam search, clean prediction at 20/35/50, final at 60.
defaults:
  - inference_on_user_inputs
  - _self_
inputs: ${oc.env:PROJECT_ROOT}/../rfd4_runs/inputs/kemp2_rfd4_buried.yaml
out_dir: ${oc.env:PROJECT_ROOT}/../rfd4_runs/out/20261121_k2_chem
run_name_: k2_chem
search:
  n_branch: 3
  beam_width: 2
  checkpoints:
    "20": {use_clean_prediction: true, metrics: [kemp_pocket, tmol_lig_ddg, kemp_chem], rewards: {tmol_lig_ddg.interface_ddg: {weight: -1.0, normalize_by: 20.0, clip: {min: -80.0, max: 20.0}}, kemp_pocket.volume_ratio_error: {weight: -0.5, clip: {max: 1.0}}, kemp_chem.base_sasa_rel: {weight: -1.0, clip: {max: 1.0}}, kemp_chem.base_apolar_frac: {weight: 1.0}, kemp_chem.nitro_hbonds: {weight: 0.5, clip: {max: 2.0}, normalize_by: 2.0}, kemp_chem.base_hbond_partners: {weight: -0.25, clip: {max: 3.0}, normalize_by: 3.0}}}
    "35": {use_clean_prediction: true, metrics: [kemp_pocket, tmol_lig_ddg, kemp_chem], rewards: {tmol_lig_ddg.interface_ddg: {weight: -1.0, normalize_by: 20.0, clip: {min: -80.0, max: 20.0}}, kemp_pocket.volume_ratio_error: {weight: -0.5, clip: {max: 1.0}}, kemp_chem.base_sasa_rel: {weight: -1.0, clip: {max: 1.0}}, kemp_chem.base_apolar_frac: {weight: 1.0}, kemp_chem.nitro_hbonds: {weight: 0.5, clip: {max: 2.0}, normalize_by: 2.0}, kemp_chem.base_hbond_partners: {weight: -0.25, clip: {max: 3.0}, normalize_by: 3.0}}}
